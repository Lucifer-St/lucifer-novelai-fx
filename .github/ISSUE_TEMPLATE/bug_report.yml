name: Bug report
description: Report a reproducible problem after reviewing the local feedback preview.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Generate and review the feedback preview in the app first, then paste it below. The app never uploads it automatically.
        Remove API keys, cookies, prompts, private paths, logs, and upstream response bodies before submitting.
  - type: textarea
    id: preview
    attributes:
      label: Reviewed feedback preview
      description: Paste the reviewed, structured preview generated by the app.
      placeholder: Paste the preview here.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed the text and removed credentials and private content.
          required: true
        - label: This is not a security vulnerability report.
          required: true

