name: Improvement request
description: Suggest an improvement using the app's reviewed feedback preview.
title: "[Improvement] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Generate and review the improvement preview in the app, then paste it below. Nothing is uploaded automatically.
        Do not include API keys, cookies, prompts, private paths, logs, or upstream response bodies.
  - type: textarea
    id: preview
    attributes:
      label: Reviewed improvement preview
      description: Paste the reviewed, structured preview generated by the app.
      placeholder: Paste the preview here.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed the text and removed credentials and private content.
          required: true

